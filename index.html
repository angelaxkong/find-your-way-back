<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Find Your Way Back</title>
<style>
  /* Layout: one slide at a time, centred like a phone carousel on the slides' own rust-red ground; tap or swipe to page. */
  :root {
    --ground: #5E2015;   /* deeper than the slide edges so the slide reads as a card */
    --rust: #8A3324;
    --butter: #FFE880;
    --cream: #E8C7A3;
    --dim: rgba(232, 199, 163, 0.45);
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--cream); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; box-sizing: border-box; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .stage {
    position: relative; width: min(100%, calc((100vh - 110px) * 0.8), 540px); aspect-ratio: 4 / 5; max-width: 100%;
    border-radius: 6px; overflow: hidden; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45); background: var(--rust); touch-action: pan-y;
  }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.35s ease; }
  .stage img.on { opacity: 1; }
  .hit { position: absolute; top: 0; bottom: 0; width: 50%; background: none; border: 0; cursor: pointer; padding: 0; }
  .hit.prev { left: 0; } .hit.next { right: 0; }
  .hit:focus-visible { outline: 2px solid var(--butter); outline-offset: -4px; }
  .bar { display: flex; align-items: center; gap: 14px; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); transition: background 0.2s, transform 0.2s; }
  .dots span.on { background: var(--butter); transform: scale(1.3); }
  .count { font-size: 13px; letter-spacing: 0.08em; color: var(--dim); font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  .music {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--dim); background: none; color: var(--dim);
    font-size: 16px; cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .music[aria-pressed="true"] { color: var(--butter); border-color: var(--butter); }
  .music:focus-visible { outline: 2px solid var(--butter); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .stage img, .dots span { transition: none; } }
</style>
</head>
<body>

<div class="stage" id="stage" aria-roledescription="carousel" aria-label="You can find your way back to each other again">
  <button class="hit prev" id="prev" aria-label="Previous slide"></button>
  <button class="hit next" id="next" aria-label="Next slide"></button>
</div>
<div class="bar"><button class="music" id="music" aria-label="Play music" aria-pressed="false">♪</button><div class="dots" id="dots"></div><div class="count" id="count">1 / 15</div></div>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
  const V = "5"; // bump after any slide change so phones don't show old cached slides
  const N = 15, stage = document.getElementById("stage"), dots = document.getElementById("dots"), count = document.getElementById("count");
  const imgs = [];
  for (let i = 1; i <= N; i++) {
    const im = document.createElement("img");
    im.src = `slides/slide-${String(i).padStart(2, "0")}.jpg?v=${V}`;
    im.alt = `Slide ${i} of ${N}`;
    if (i === 1) im.className = "on";
    stage.insertBefore(im, document.getElementById("prev")); // images under the tap zones
    imgs.push(im);
    dots.appendChild(document.createElement("span"));
  }
  let k = 0;
  function show(n) {
    k = Math.max(0, Math.min(N - 1, n));
    imgs.forEach((im, i) => im.classList.toggle("on", i === k));
    [...dots.children].forEach((d, i) => d.classList.toggle("on", i === k));
    count.textContent = `${k + 1} / ${N}`;
  }
  show(0);
  document.getElementById("prev").onclick = () => show(k - 1);
  document.getElementById("next").onclick = () => show(k + 1);
  addEventListener("keydown", (e) => { if (e.key === "ArrowRight") show(k + 1); if (e.key === "ArrowLeft") show(k - 1); });
  // music: starts on the first tap anywhere (browsers block sound before that); ♪ toggles it
  const song = document.getElementById("song"), btn = document.getElementById("music");
  song.volume = 0.7;
  let started = false, muted = false;
  const sync = () => { btn.setAttribute("aria-pressed", String(!song.paused)); btn.setAttribute("aria-label", song.paused ? "Play music" : "Pause music"); };
  const play = () => song.play().then(sync).catch(sync);
  btn.onclick = (e) => { e.stopPropagation(); started = true; if (song.paused) { muted = false; play(); } else { muted = true; song.pause(); sync(); } };
  addEventListener("pointerdown", (e) => { if (e.target === btn) return; if (!started && !muted) { started = true; play(); } }, { capture: true });
  addEventListener("keydown", () => { if (!started && !muted) { started = true; play(); } }, { capture: true });
  let x0 = null;
  stage.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(k + (dx < 0 ? 1 : -1)); x0 = null; });
</script>
</body>
</html>
